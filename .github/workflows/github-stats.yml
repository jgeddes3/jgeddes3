name: Update GitHub Stats

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Add a STATS_TOKEN secret (classic PAT with repo + read:user) to include private repos.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=jgeddes3&show_icons=true&hide_border=true&bg_color=000000&title_color=36854C&text_color=FFFFFF&icon_color=36854C
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=jgeddes3&layout=compact&hide_border=true&bg_color=000000&title_color=36854C&text_color=FFFFFF
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate activity graph
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: jgeddes3
        run: python3 .github/scripts/activity_graph.py profile/activity-graph.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile
          git diff --quiet --cached || (git commit -m "Update GitHub stats" && git pull --rebase && git push)
